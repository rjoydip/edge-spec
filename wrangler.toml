name = "edge-spec"
# Built by config/vite.worker.ts; wrangler only uploads the bundled output.
main = "dist/worker/index.js"
compatibility_date = "2025-07-18"
compatibility_flags = ["nodejs_compat"]

# Daily cron; each repository's D1 schedule decides whether it is due.
[triggers]
crons = ["0 8 * * *"]

# Dashboard SPA, built by `bun run build:web`.
# Assets-first routing: requests that match a file are served statically;
# everything else (/api/*, /webhook) falls through to the Worker.
[assets]
directory = "dist/web"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Workers AI is the only provider that needs no user key.
[ai]
binding = "AI"
remote = true

# Durable path for GitHub webhooks. The interactive dashboard path is a
# streamed /api/run and never stores user credentials.
[[workflows]]
name = "test-generation-workflow"
binding = "TEST_GENERATION_WORKFLOW"
class_name = "TestGenerationWorkflow"

# GitHub App for webhook CI (optional; replaces GITHUB_TOKEN for workflow runs).
# The app id and PKCS#8 private key are deployment secrets, never user config:
#   wrangler secret put GITHUB_APP_ID
#   wrangler secret put GITHUB_APP_PRIVATE_KEY
#   wrangler secret put GITHUB_WEBHOOK_SECRET
# The dashboard keeps using the visitor's per-request PAT. Installation tokens
# are minted per run, scoped to the repository, and cached only until expiry.

# Run history, backlog, policies, memory, schedules, workspace and audit.
# Created with `wrangler d1 create edge-spec-runs`; migrations live in
# migrations/ and are applied with `wrangler d1 migrations apply`.
[[d1_databases]]
binding = "RUNS_DB"
database_name = "edge-spec-runs"
database_id = "e6d6d95e-cbce-498f-952e-c4d30fc1f7de"

# Drift notifications (optional, Slack-compatible webhook):
#   wrangler secret put DRIFT_WEBHOOK_URL
#   wrangler secret put DRIFT_WEBHOOK_SECRET
# Optional R2 artifacts for drift summaries:
# [[r2_buckets]]
# binding = "ARTIFACTS"
# bucket_name = "edge-spec-artifacts"
