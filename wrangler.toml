name = "edge-spec"
# Built by config/vite.worker.ts; wrangler only uploads the bundled output.
main = "dist/worker/index.js"
compatibility_date = "2025-07-18"
compatibility_flags = ["nodejs_compat"]

# Dashboard SPA, built by `bun run build:web`.
# Assets-first routing: requests that match a file are served statically;
# everything else (/api/*, /webhook) falls through to the Worker.
[assets]
directory = "dist/web"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Workers AI is the only provider that needs no user key.
[ai]
binding = "AI"
remote = true

# Durable path for GitHub webhooks. The interactive dashboard path is a
# streamed /api/run and never stores user credentials.
[[workflows]]
name = "test-generation-workflow"
binding = "TEST_GENERATION_WORKFLOW"
class_name = "TestGenerationWorkflow"

# Optional run history. Create the database, paste its id, apply the migrations
# in migrations/, then uncomment this block:
#   wrangler d1 create edge-spec-runs
#   wrangler d1 migrations apply edge-spec-runs --remote
# [[d1_databases]]
# binding = "RUNS_DB"
# database_name = "edge-spec-runs"
# database_id = "<paste-the-id-here>"
