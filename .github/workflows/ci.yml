name: CI

on:
  push:
  pull_request:

# No Cloudflare credentials needed: this checks formatting, lint, types, unit
# tests, the golden-scan eval, and that the workspace bundles and docs build.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun check .

      - name: Unit tests
        run: bun run test

      - name: Golden-scan eval
        run: bun run eval

      - name: Build dashboard and Worker bundles
        run: bun run build

      - name: Build documentation site
        run: bun run docs:build
