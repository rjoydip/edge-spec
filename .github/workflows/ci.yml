name: CI

on:
  push:
  pull_request:

# No Cloudflare credentials needed: this only checks formatting, lint, types,
# tests, and that the workspace bundles and docs build.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Format, lint, types, tests
        run: bun run verify

      - name: Build dashboard and Worker bundles
        run: bun run build

      - name: Build documentation site
        run: bun run docs:build
