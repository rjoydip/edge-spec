name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      adopt:
        description: "Adopt an existing Worker, D1, R2 and Workflow into a new Alchemy state store"
        type: boolean
        default: false

# One deploy at a time, and never cancel one that is already uploading.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build dashboard and Worker bundles
        run: bun run build

      # `adopt` is only for a new account or a lost Alchemy state store: it
      # imports a Worker, D1 database, R2 bucket and Workflow that already
      # exist but are not owned by this stack yet. Normal deploys leave it off.
      - name: Deploy to Cloudflare with Alchemy
        run: bun run alchemy deploy --stage prod --yes ${{ inputs.adopt && '--adopt' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GH_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # Optional: set the STACK_URL repository variable to smoke the deployed
      # Worker after every production run (health, catalog, SPA, D1).
      - name: Smoke the deployment
        if: vars.STACK_URL != ''
        run: SKIP_DEPLOY=1 STACK_URL=${{ vars.STACK_URL }} bun run --cwd infra test
