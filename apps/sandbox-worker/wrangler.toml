name = "edge-spec-sandbox"
main = "src/index.ts"
compatibility_date = "2026-10-25"
compatibility_flags = ["nodejs_compat"]

# The Cloudflare Sandbox image ships Bun, Node, git and common utilities.
[[containers]]
class_name = "Sandbox"
image = "./Dockerfile"

[[durable_objects.bindings]]
name = "Sandbox"
class_name = "Sandbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sandbox"]
